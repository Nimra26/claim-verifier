[project]
name = "claim-verifier"
version = "0.1.0"
description = "LangGraph agent that checks the factual claims in a set of documents against each other and writes an evidence-backed report."
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.1.3",
    "anthropic==0.125.0",
    "pyyaml==6.0.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "sqlalchemy[asyncio]==2.0.48",
    "asyncpg==0.31.0",
    "greenlet==3.3.2",
    "openai==2.29.0",
    "pandas==3.0.1",
    "pdfplumber==0.11.9",
    "rapidfuzz==3.14.3",
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false
